name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  powershell-suite:
    name: PowerShell 语法 + 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打印环境
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          dotnet --version

      - name: 语法检查（所有 .ps1）
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              Write-Host "ERR $($_.Name): $($errors[0].Message)"
            }
          }
          if ($bad -gt 0) { throw "$bad 个脚本语法错误" }
          Write-Host "语法检查通过"

      - name: 测试套件
        shell: pwsh
        run: |
          .\tests\run-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "测试失败 (exit $LASTEXITCODE)" }

  build-csharp:
    name: C# 编译（单文件发布）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 拉取中文 OCR 模型（带 SHA256 校验）
        shell: pwsh
        run: .\models\fetch-models.ps1

      - name: 同步随包资源到 app/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/data, app/templates, app/models | Out-Null
          Copy-Item data/* app/data -Recurse -Force
          Copy-Item templates/* app/templates -Recurse -Force
          foreach ($v in 'v5','v6') {
            if (Test-Path "models/$v") {
              New-Item -ItemType Directory -Force "app/models/$v" | Out-Null
              Copy-Item "models/$v/*" "app/models/$v" -Force
            }
          }
          Get-ChildItem app/models -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "模型总大小 {0:N1} MB" -f ($_.Sum/1MB) }

      - name: 还原
        run: dotnet restore app/TheaterAssistant.csproj

      - name: 编译
        run: dotnet build app/TheaterAssistant.csproj -c Release --no-restore

      - name: 单文件发布
        run: >
          dotnet publish app/TheaterAssistant.csproj -c Release -r win-x64
          --self-contained true -o dist --no-restore

      - name: 产物信息
        shell: pwsh
        run: |
          Get-ChildItem dist | Select-Object Name, Length
          if (-not (Test-Path dist/TheaterAssistant.exe)) { throw "没有产出 exe" }

      - name: 幕内知识来自数据（playbook 清单）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $exe = Join-Path (Get-Location) 'dist/TheaterAssistant.exe'
          $out = Join-Path $env:RUNNER_TEMP 'pb.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--playbook' -Wait -PassThru -RedirectStandardOutput $out
          Get-Content $out -Encoding UTF8 | Select-Object -First 14
          if ($p.ExitCode -ne 0) { throw "playbook 清单失败 exit=$($p.ExitCode)" }

      - name: 通用最优配队（假设全角色，每难度每幕）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $exe = Join-Path (Get-Location) 'dist/TheaterAssistant.exe'
          $out = Join-Path $env:RUNNER_TEMP 'team-solve.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--team-solve','--difficulty','all' -Wait -PassThru -RedirectStandardOutput $out
          $lines = Get-Content $out -Encoding UTF8
          $lines | Select-Object -First 60
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 通用最优配队（假设全角色选本季元素）"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + [Environment]::NewLine + ($lines -join [Environment]::NewLine) + [Environment]::NewLine + '```')
          if ($p.ExitCode -ne 0) { throw "配队求解失败 exit=$($p.ExitCode)" }

      # DirectML 是可选加速：默认构建不带它（保体积/离线）。这里验证"能编译"，
      # 但不把成功当必过——runner 无 GPU，EP 能否真正启用只能在玩家真机验证。
      - name: 尝试 DirectML 构建（可选，失败不阻断）
        continue-on-error: true
        shell: pwsh
        run: |
          chcp 65001 > $null
          New-Item -ItemType Directory -Force app/data, app/templates | Out-Null
          Copy-Item data/* app/data -Recurse -Force -ErrorAction SilentlyContinue
          dotnet build app/TheaterAssistant.csproj -c Release -p:DirectMLVersion=1.29.0 -o dist-dml 2>&1 | Select-Object -Last 12
          if (Test-Path dist-dml/TheaterAssistant.exe) {
            "DirectML 构建产物: $((Get-Item dist-dml/TheaterAssistant.exe).Length) 字节"
          } else { throw "未产出 exe" }

      - name: OCR 执行提供器实测（真实初始化引擎）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $exe = Join-Path (Get-Location) 'dist/TheaterAssistant.exe'
          $out = Join-Path $env:RUNNER_TEMP 'ocr-ep.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--ocr-ep' -Wait -PassThru -RedirectStandardOutput $out
          $lines = Get-Content $out -Encoding UTF8
          $lines | Select-Object -First 10
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### OCR 执行提供器"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + [Environment]::NewLine + ($lines -join [Environment]::NewLine) + [Environment]::NewLine + '```')
          if ($p.ExitCode -ne 0) { throw "OCR 引擎初始化失败 exit=$($p.ExitCode)" }

      - name: 大模型端点配置校验（离线，不联网）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $exe = Join-Path (Get-Location) 'dist/TheaterAssistant.exe'
          $out = Join-Path $env:RUNNER_TEMP 'llm-dry.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--llm-probe','--dry' -Wait -PassThru -RedirectStandardOutput $out
          Get-Content $out -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "llm 配置校验失败 exit=$($p.ExitCode)" }

      - name: 大模型端点真实探针（Pollinations → OpenRouter → Groq，容错不阻断）
        shell: pwsh
        continue-on-error: true
        run: |
          chcp 65001 > $null
          $exe = Join-Path (Get-Location) 'dist/TheaterAssistant.exe'
          $out = Join-Path $env:RUNNER_TEMP 'llm-live.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--llm-probe' -Wait -PassThru -RedirectStandardOutput $out
          $lines = Get-Content $out -Encoding UTF8
          $lines | Select-Object -First 24
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 大模型端点真实探针（Pollinations → OpenRouter → Groq）"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('```' + [Environment]::NewLine + ($lines -join [Environment]::NewLine) + [Environment]::NewLine + '```')
          # 三个都没通才算环境问题；单端点失败属预期（未配 key 或限流）
          if ($p.ExitCode -ne 0) { Write-Warning "真实探针 exit=$($p.ExitCode)（未阻断 CI）" }

      - name: 自检（纯函数 + OCR 坐标）
        shell: pwsh
        run: |
          chcp 65001 > $null
          # WinExe 从 pwsh 直接调用不会同步返回，必须 Start-Process -Wait 才能拿到退出码
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest --with-ocr' -Wait -PassThru
          if (Test-Path .\dist\selftest-report.txt) { Get-Content .\dist\selftest-report.txt -Encoding UTF8 }
          Write-Host "selftest exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "自检失败 (exit $($p.ExitCode))" }

      - name: 批量适配端到端（合成帧 → 模板 + 质检报告）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $synth = Join-Path $env:RUNNER_TEMP 'batch-frames'
          $out   = Join-Path $env:RUNNER_TEMP 'batch-templates'
          Remove-Item $synth, $out -Recurse -Force -ErrorAction SilentlyContinue
          $o = Join-Path $env:RUNNER_TEMP 'batch.stdout.txt'
          $e = Join-Path $env:RUNNER_TEMP 'batch.stderr.txt'

          $p1 = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--synth `"$synth`"" -Wait -PassThru
          if ($p1.ExitCode -ne 0) { throw "生成合成帧失败 (exit $($p1.ExitCode))" }

          $p2 = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--batch `"$synth`" --out `"$out`"" -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
          Write-Host "batch exit=$($p2.ExitCode)"
          if (Test-Path $o) { Write-Host '--- batch stdout ---'; Get-Content $o -Encoding UTF8 }
          if (Test-Path $e) { Write-Host '--- batch stderr ---'; Get-Content $e -Encoding UTF8 }
          Get-ChildItem .\dist -Filter 'crash-*.txt' -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Encoding UTF8
          }

          $report = Join-Path $out 'batch-report.json'
          if (-not (Test-Path $report)) { throw "没有产出 batch-report.json" }
          if (Test-Path (Join-Path $out 'batch-report.md')) { Get-Content (Join-Path $out 'batch-report.md') -Encoding UTF8 }
          $j = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "候选模板 $($j.candidates) / 安装 $($j.installed)"
          Get-ChildItem $out -Recurse -Filter *.png | Select-Object FullName, Length
          if ($p2.ExitCode -ne 0) { throw "批量适配失败 (exit $($p2.ExitCode))" }
          if ($j.candidates -lt 2) { throw "候选模板过少：$($j.candidates)" }
          if ($j.installed -lt 2) { throw "通过质检的模板过少：$($j.installed)" }

          # 幕次判定回归门：a1/a2/c1/c2 都写了「第3幕」，必须仍判出第 3 幕
          # （曾因"大堂词压掉条带"过度修复，把这 4 帧的幕次判成空，而当时 CI 不查 act 所以没报错）
          $actRows = @($j.frameDetail | Where-Object { $_.act -ne $null })
          Write-Host "判出幕次的帧: $($actRows.Count) 条（$($actRows.File -join ', ')）"
          if ($actRows.Count -lt 4) { throw "幕次判定回归：期望 ≥4 帧判出幕次，实际 $($actRows.Count)" }
          if (-not ($actRows | Where-Object { $_.act -eq 3 })) { throw "幕次判定回归：合成帧写的是第3幕，未判出 3" }

      - name: 悬浮窗渲染自检（画到 bitmap 上断言）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest-visual' -Wait -PassThru
          if (Test-Path .\dist\selftest-visual-report.txt) { Get-Content .\dist\selftest-visual-report.txt -Encoding UTF8 }
          Write-Host "selftest-visual exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "悬浮窗渲染自检失败 (exit $($p.ExitCode))" }

      - name: 真机模拟实测（假游戏窗口 → GDI 抓屏 → 识别）；无桌面会话时跳过
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest-live --size 1600x900' -Wait -PassThru
          if (Test-Path .\dist\selftest-live-report.txt) { Get-Content .\dist\selftest-live-report.txt -Encoding UTF8 }
          Write-Host "selftest-live exit=$($p.ExitCode)"
          if ($p.ExitCode -eq 4) {
            # 跳过也要显式告警，否则"绿"不代表真机链路跑过
            Write-Host "::warning::真机模拟被跳过：runner 桌面抓屏为空（没有可捕获的会话）"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 真机模拟实测：SKIP（抓屏空白，无桌面会话）"
          }
          elseif ($p.ExitCode -ne 0) { throw "真机模拟实测失败 (exit $($p.ExitCode))" }
          else { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 真机模拟实测：PASS（8/8 断言）" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TheaterAssistant-ci-${{ github.sha }}
          path: dist/
          retention-days: 7
