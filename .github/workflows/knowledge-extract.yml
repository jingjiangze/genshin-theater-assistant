name: knowledge-extract

on:
  push:
    branches:
      - 'automation/**'
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
  workflow_run:
    workflows: ["video-ingest"]
    types: [completed]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout durable batch ledger
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: .pipeline-state
          fetch-depth: 0

      - name: Extract and merge knowledge candidates
        shell: bash
        run: |
          set -euo pipefail
          python tools/pipeline/extract_knowledge.py \
            --ledger-repo .pipeline-state \
            --batches .pipeline-state/.pipeline-state/batches \
            --registry .pipeline-state/.pipeline-state/knowledge/registry.json
