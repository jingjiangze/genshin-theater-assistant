name: corpus-refresh

# 持续语料训练（定时 + 手动）：
#   1) 用 BILI_COOKIE secret 搜 B站新视频（剧诗全程/攻略），抽 1080p 帧
#   2) --corpus-scan 从画面 OCR 抽攻略文字 → data/guide-corpus-extra.json
#   3) fetch-wiki-corpus.mjs 抓 BWIKI 词条 → data/guide-corpus-wiki.json
#   4) 用 --selftest 与 --advise 回归，确认语料没把检索搞坏
#   5) 把两个语料文件提交回 main（可用 commit=false 只留 artifact）
#
# 用法：Actions → corpus-refresh → Run workflow
#   keyword : 搜索关键词（默认 幻想真境剧诗 全程）
#   videos  : 最多取多少个视频（默认 2）
#   spread  : 每个视频抽几帧（默认 12）
#   commit  : 是否持久化候选批次到长期账本（默认 true）

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: 'B站搜索关键词'
        required: false
        default: '幻想真境剧诗 全程'
      videos:
        description: '取前 N 个视频'
        required: false
        default: '2'
      spread:
        description: '每个视频抽帧数'
        required: false
        default: '12'
      bvids:
        description: '直接指定 BV 号（逗号分隔，填了就跳过搜索）'
        required: false
        default: ''
      commit:
        description: '持久化候选语料到 automation-data（true/false；不写 main）'
        required: false
        default: 'true'
  schedule:
    - cron: '0 4 * * 1,4'   # 每周一/周四 04:00 UTC

permissions:
  contents: write

concurrency:
  group: theater-pipeline-state
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 依赖（playwright + chromium）
        shell: pwsh
        run: |
          cd tools\video-frames
          if (-not (Test-Path package.json)) { npm init -y | Out-Null }
          # 固定版本 + 用 playwright-core 自带 CLI：npx playwright 会去装 playwright@latest，
          # 而 registry 里可能还没有对应 playwright-core 版本（实测 ETARGET @1.65.0）
          npm i playwright-core@1.64.1 --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium

      - name: 拉 OCR 模型并构建 exe
        shell: pwsh
        run: |
          .\models\fetch-models.ps1
          New-Item -ItemType Directory -Force app/data, app/templates, app/models | Out-Null
          Copy-Item data/* app/data -Recurse -Force
          Copy-Item templates/* app/templates -Recurse -Force
          foreach ($v in 'v5','v6') {
            if (Test-Path "models/$v") {
              New-Item -ItemType Directory -Force "app/models/$v" | Out-Null
              Copy-Item "models/$v/*" "app/models/$v" -Force
            }
          }
          dotnet publish app/TheaterAssistant.csproj -c Release -o dist

      - name: 搜 B站新视频（cookie 只从 secret 读）
        shell: pwsh
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          if (-not $env:BILI_COOKIE) { throw "缺少 secret BILI_COOKIE" }
          $direct = "${{ github.event.inputs.bvids }}"
          if ($direct) { "BVS=$direct" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8; Write-Host "使用指定 BV：$direct"; exit 0 }
          $kw = "${{ github.event.inputs.keyword }}"; if (-not $kw) { $kw = '幻想真境剧诗 全程' }
          $n = "${{ github.event.inputs.videos }}"; if (-not $n) { $n = '2' }
          cd tools\video-frames
          $json = node search.mjs "$kw" $n
          $json | Out-File -Encoding UTF8 $env:RUNNER_TEMP\bvs.json
          $j = ($json -join "`n") | ConvertFrom-Json
          if (-not $j -or -not $j.items -or $j.items.Count -eq 0) { throw "搜索没返回视频（关键词：$kw）——可用 bvids 输入直填" }
          Write-Host "搜到 $($j.items.Count) 个视频："
          $j.items | ForEach-Object { Write-Host "  $($_.bv)  $($_.title)" }
          $bvs = ($j.items | Select-Object -ExpandProperty bv) -join ','
          "BVS=$bvs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8

      - name: 抽帧
        shell: pwsh
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          $spread = "${{ github.event.inputs.spread }}"; if (-not $spread) { $spread = '12' }
          New-Item -ItemType Directory -Force frames | Out-Null
          cd tools\video-frames
          foreach ($bv in "$env:BVS".Split(',', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            Write-Host "=== $bv ==="
            node hd.mjs $bv "spread=$spread" "out=../../frames"
          }

      - name: 抽语料（视频 OCR）
        shell: pwsh
        run: |
          chcp 65001 > $null
          Remove-Item data/guide-corpus-extra.json -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--corpus-scan `"$PWD\frames`" --out `"$PWD\data\guide-corpus-extra.json`" --bvid `"$env:BVS`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "corpus-scan 失败（exit=$($p.ExitCode)），拒绝沿用旧文件" }
          if (-not (Test-Path data/guide-corpus-extra.json)) { throw "corpus-scan 未生成新语料文件" }
          $fresh = Get-Content data/guide-corpus-extra.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($null -eq $fresh.entries) { throw "新视频语料缺少 entries 数组" }


      - name: 生成角色 ID→名字表（公开静态元数据）
        shell: pwsh
        continue-on-error: true
        run: node tools/fetch-avatar-ids.mjs

      - name: 抓 BWIKI 语料
        shell: pwsh
        run: |
          Remove-Item data/guide-corpus-wiki.json -Force -ErrorAction SilentlyContinue
          node tools/fetch-wiki-corpus.mjs --out data/guide-corpus-wiki.json --pages "翠翎恐蕈,深黯魇语之主,蕴光月守宫"
          if (-not (Test-Path data/guide-corpus-wiki.json)) { throw "BWIKI 未生成新语料文件" }
          $fresh = Get-Content data/guide-corpus-wiki.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($null -eq $fresh.entries) { throw "BWIKI 新语料缺少 entries 数组" }

      - name: 回归（自检 + 检索抽查）
        shell: pwsh
        run: |
          chcp 65001 > $null
          # 单文件 exe 的 data 是打包时嵌入的，必须把「刚抓的语料」放到 exe 同级 data/ 才会被读到
          # （AppPaths.Resolve 优先 exe 同级，其次解包目录）
          New-Item -ItemType Directory -Force dist/data | Out-Null
          Copy-Item data/*.json dist/data -Force
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest' -Wait -PassThru
          if (Test-Path .\dist\selftest-report.txt) { Get-Content .\dist\selftest-report.txt -Encoding UTF8 | Select-Object -Last 6 }
          if ($p.ExitCode -ne 0) { throw "语料刷新后自检失败，拒绝提交" }
          $o = Join-Path $env:RUNNER_TEMP 'adv.txt'
          $p2 = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--advise "第3幕 翠翎恐蕈" --top 1' -Wait -PassThru -RedirectStandardOutput $o
          Get-Content $o -Encoding UTF8 | Select-Object -First 4

      - name: 统计与产物
        shell: pwsh
        run: |
          $a = (Get-Content data/guide-corpus-extra.json -Raw -Encoding UTF8 | ConvertFrom-Json).entries.Count
          $w = (Get-Content data/guide-corpus-wiki.json -Raw -Encoding UTF8 | ConvertFrom-Json).entries.Count
          $s = (Get-Content data/guide-corpus.json -Raw -Encoding UTF8 | ConvertFrom-Json).entries.Count
          Write-Host "语料：手工 $s + 视频 $a + wiki $w"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 语料刷新：手工 $s / 视频 $a / wiki $w"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: |
            data/guide-corpus-extra.json
            data/guide-corpus-wiki.json
          retention-days: 30

      - name: 连接长期数据账本
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit != 'false' }}
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: .pipeline-state
          fetch-depth: 0

      - name: 持久化候选语料（不直接发布到 main）
        if: ${{ github.event_name == 'schedule' || github.event.inputs.commit != 'false' }}
        shell: pwsh
        run: |
          python tools/pipeline/persist_batch.py --kind corpus --input-dir data --state-dir .pipeline-state
