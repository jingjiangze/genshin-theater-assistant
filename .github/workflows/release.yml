name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 拉取中文 OCR 模型（带 SHA256 校验）
        shell: pwsh
        run: .\models\fetch-models.ps1

      - name: 同步随包资源到 app/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/data, app/templates, app/models | Out-Null
          Copy-Item data/* app/data -Recurse -Force
          Copy-Item templates/* app/templates -Recurse -Force
          foreach ($v in 'v5','v6') {
            if (Test-Path "models/$v") {
              New-Item -ItemType Directory -Force "app/models/$v" | Out-Null
              Copy-Item "models/$v/*" "app/models/$v" -Force
            }
          }
          Get-ChildItem app/models -Recurse -File | Measure-Object Length -Sum | ForEach-Object { "模型总大小 {0:N1} MB" -f ($_.Sum/1MB) }
      - name: publish
        run: dotnet publish app/TheaterAssistant.csproj -c Release -o dist

      - name: 发布前自检（不通过就不发）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest --with-ocr' -Wait -PassThru
          if (Test-Path .\dist\selftest-report.txt) { Get-Content .\dist\selftest-report.txt -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { throw "自检失败，拒绝发布 (exit $($p.ExitCode))" }

      - name: 发布前渲染自检（悬浮窗画到 bitmap 断言）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest-visual' -Wait -PassThru
          if (Test-Path .\dist\selftest-visual-report.txt) { Get-Content .\dist\selftest-visual-report.txt -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { throw "渲染自检失败，拒绝发布 (exit $($p.ExitCode))" }

      - name: 发布前真机模拟实测（抓屏为空则跳过，不算失败）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList '--selftest-live --size 1600x900' -Wait -PassThru
          if (Test-Path .\dist\selftest-live-report.txt) { Get-Content .\dist\selftest-live-report.txt -Encoding UTF8 }
          if ($p.ExitCode -eq 4) { Write-Host "::warning::真机模拟被跳过（无桌面会话）" }
          elseif ($p.ExitCode -ne 0) { throw "真机模拟失败，拒绝发布 (exit $($p.ExitCode))" }

      - name: zip + 单独 exe
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath TheaterAssistant-win-x64.zip -Force
          # 直接给单文件 exe 作为发布资产：zip 里也是同一个 exe，但用户常常只想要 exe
          Copy-Item dist/TheaterAssistant.exe TheaterAssistant.exe -Force
          Get-Item TheaterAssistant.exe, TheaterAssistant-win-x64.zip | Select-Object Name, Length
          (Get-FileHash TheaterAssistant.exe -Algorithm SHA256).Hash | Set-Content TheaterAssistant.exe.sha256
          Get-Content TheaterAssistant.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: TheaterAssistant
          path: |
            TheaterAssistant-win-x64.zip
            TheaterAssistant.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            TheaterAssistant-win-x64.zip
            TheaterAssistant.exe
            TheaterAssistant.exe.sha256
