name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: publish
        run: dotnet publish app/TheaterAssistant.csproj -c Release -o dist
      - name: zip
        shell: powershell
        run: |
          Compress-Archive -Path dist/* -DestinationPath TheaterAssistant-win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TheaterAssistant
          path: TheaterAssistant-win-x64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: TheaterAssistant-win-x64.zip
