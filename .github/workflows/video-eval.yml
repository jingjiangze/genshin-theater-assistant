name: video-eval

# 用真实视频做"对答案"回归：
#   抽帧 → --replay 逐帧跑完整链路 → 用视频自带的「第N幕」当标准答案算准确率 → 上传报告
# 优先选攻略 UP 主的高难度纯净流（标题里带 攻略/满花/卓越/月谕/全程），这类画面干净、幕次标签清楚。
#
# 用法：Actions → video-eval → Run workflow
#   bvids : 空格分隔的 BV 号（留空则用关键词搜索前 N 个）
#   keyword / videos / every / max / min-acc

on:
  workflow_dispatch:
    inputs:
      bvids:
        description: 'BV 号（空格分隔，留空则搜索）'
        required: false
        default: ''
      keyword:
        description: '搜索关键词（bvids 为空时使用）'
        required: false
        default: '幻想真境剧诗 月谕 攻略 全程'
      videos:
        description: '搜索取前 N 个'
        required: false
        default: '2'
      every:
        description: '每 N 秒一帧'
        required: false
        default: '8'
      max:
        description: '每个视频最多抽帧'
        required: false
        default: '40'
      min-acc:
        description: '视觉条带代理自洽率告警阈值（仅诊断，不作为独立评测门禁）'
        required: false
        default: '95'
  schedule:
    - cron: '0 5 * * *'   # 每天 05:00 UTC（对答案回归）

permissions:
  contents: write

jobs:
  eval:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install yt-dlp
          cd tools\video-frames
          if (-not (Test-Path package.json)) { npm init -y | Out-Null }
          # 固定版本 + 用 playwright-core 自带 CLI：npx playwright 会去装 playwright@latest，
          # 而 registry 里可能还没有对应 playwright-core 版本（实测 ETARGET @1.65.0）
          npm i playwright-core@1.64.1 --no-audit --no-fund
          node node_modules/playwright-core/cli.js install chromium

      - name: 构建
        shell: pwsh
        run: |
          .\models\fetch-models.ps1
          New-Item -ItemType Directory -Force app/data, app/templates, app/models | Out-Null
          Copy-Item data/* app/data -Recurse -Force
          Copy-Item templates/* app/templates -Recurse -Force
          foreach ($v in 'v5','v6') {
            if (Test-Path "models/$v") {
              New-Item -ItemType Directory -Force "app/models/$v" | Out-Null
              Copy-Item "models/$v/*" "app/models/$v" -Force
            }
          }
          dotnet publish app/TheaterAssistant.csproj -c Release -o dist

      - name: 解析视频列表
        shell: pwsh
        run: |
          $bvs = "${{ github.event.inputs.bvids }}"
          if (-not $bvs) {
            $kw = "${{ github.event.inputs.keyword }}"; if (-not $kw) { $kw = '幻想真境剧诗 月谕 攻略 全程' }
            $n  = "${{ github.event.inputs.videos }}"; if (-not $n) { $n = '2' }
            cd tools\video-frames
            $json = node search.mjs "$kw" $n
            $j = ($json -join "`n") | ConvertFrom-Json
            if (-not $j.items -or $j.items.Count -eq 0) { throw "搜索没结果（关键词：$kw）" }
            $bvs = ($j.items | Select-Object -ExpandProperty bv) -join ' '
          }
          "BVS=$bvs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          Write-Host "待评测：$bvs"

      - name: 获取独立文本标签来源（字幕 + 章节，不使用 OCR）
        continue-on-error: true
        shell: pwsh
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          New-Item -ItemType Directory -Force frames/ingest | Out-Null
          $csv = ($env:BVS -split '\s+' | Where-Object { $_ }) -join ','
          python tools/video-frames/ingest.py --platform bilibili --bvs "$csv" --limit 12 --out frames/ingest

      - name: 抽帧
        shell: pwsh
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          if (-not $env:BILI_COOKIE) { throw "缺少 secret BILI_COOKIE" }
          $every = "${{ github.event.inputs.every }}"; if (-not $every) { $every = '5' }
          $max   = "${{ github.event.inputs.max }}";   if (-not $max)   { $max   = '200' }
          New-Item -ItemType Directory -Force frames | Out-Null
          cd tools\video-frames
          foreach ($bv in "$env:BVS".Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            Write-Host "=== $bv ==="
            node hd.mjs $bv "every=$every" "max=$max" "out=../../frames/$bv"
          }

      - name: 逐视频评测（对答案）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $minAcc = [double]"${{ github.event.inputs.min-acc }}"
          if (-not $minAcc) { $minAcc = 0 }
          $summary = @()
          foreach ($bv in "$env:BVS".Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            $dir = "frames/$bv"
            if (-not (Test-Path $dir)) { Write-Host "跳过 $bv（无帧）"; continue }
            $md = "frames/$bv-replay.md"
            $js = "frames/$bv-replay.json"
            $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--replay `"$dir`" --out `"$md`" --json `"$js`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\$bv.out.txt"
            Get-Content "$env:RUNNER_TEMP\$bv.out.txt" -Encoding UTF8 | Select-Object -First 14
            $acc = 0.0
            $truth = 0
            if (Test-Path $md) {
              $line = Select-String -Path $md -Pattern '自洽率 \*\*([\d\.]+)%' | Select-Object -First 1
              if ($line) { $acc = [double]$line.Matches[0].Groups[1].Value }
              $tline = Select-String -Path $md -Pattern '有代理标签 (\d+) 帧' | Select-Object -First 1
              if ($tline) { $truth = [int]$tline.Matches[0].Groups[1].Value }
            }
            $accText = if ($truth -eq 0) { "n/a（无代理标签帧）" } else { "$acc%（代理自洽）" }
            $summary += "| $bv | $accText | exit=$($p.ExitCode) |"
            # 该指标来自同帧底部条带 OCR，只作自洽性告警，不是独立真值，也不阻断独立评测。
            if ($minAcc -gt 0 -and $truth -gt 0 -and $acc -lt $minAcc) { Write-Host "::warning::$bv 视觉代理自洽率 $acc%（代理标签帧 $truth）低于诊断阈值 $minAcc%" }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### 视觉条带代理自洽性（非独立准确率）"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| 视频 | 视觉代理自洽率 | 退出码 |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "|---|---|---|"
          foreach ($l in $summary) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $l }

      - name: 独立评测（字幕与章节双来源一致才计入）
        shell: pwsh
        run: |
          python tools/pipeline/build_external_eval.py --replay-dir frames --ingest-dir frames/ingest --out frames/external-eval.json --min-labels 10
          Get-Content frames/external-eval.json -Encoding UTF8 | Select-Object -First 60

      - name: 提取操作用法候选（连招/购买/配队/行动）
        shell: pwsh
        run: |
          chcp 65001 > $null
          foreach ($bv in "$env:BVS".Split(' ', [System.StringSplitOptions]::RemoveEmptyEntries)) {
            $dir = "frames/$bv"
            if (-not (Test-Path $dir)) { continue }
            $out = "frames/$bv-ops.json"
            $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--extract-ops `"$dir`" --out `"$out`" --bvid $bv" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\$bv-ops.txt"
            Get-Content "$env:RUNNER_TEMP\$bv-ops.txt" -Encoding UTF8 | Select-Object -First 3
          }

      - name: 蒸馏经验（样本 → SUMMARY.md + rules.json）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--distill `"$PWD\frames`" --out `"$PWD\docs\experience`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\distill.txt"
          Get-Content "$env:RUNNER_TEMP\distill.txt" -Encoding UTF8 | Select-Object -First 6
          if (Test-Path .\docs\experience\SUMMARY.md) { Get-Content .\docs\experience\SUMMARY.md -Encoding UTF8 | Select-Object -First 14 }

      - name: 跨视频操作共识（≥2 个 UP 主都这么写才采信）
        shell: pwsh
        run: |
          chcp 65001 > $null
          $p = Start-Process -FilePath .\dist\TheaterAssistant.exe -ArgumentList "--consensus `"$PWD\frames`" --out `"$PWD\docs\experience\OPS-CONSENSUS.md`"" -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\consensus.txt"
          Get-Content "$env:RUNNER_TEMP\consensus.txt" -Encoding UTF8 | Select-Object -First 12

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-eval-${{ github.run_id }}
          path: |
            frames/*-replay.md
            frames/*-replay.json
            frames/*-ops.json
            frames/external-eval.json
            docs/experience/SUMMARY.md
            docs/experience/rules.json
            docs/experience/OPS-CONSENSUS.md
          retention-days: 30

      - name: 准备允许持久化的评测报告
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pipeline-export/experience | Out-Null
          Copy-Item frames/*-replay.md pipeline-export/ -ErrorAction SilentlyContinue
          Copy-Item frames/*-replay.json pipeline-export/ -ErrorAction SilentlyContinue
          Copy-Item frames/*-ops.json pipeline-export/ -ErrorAction SilentlyContinue
          if (Test-Path frames/external-eval.json) { Copy-Item frames/external-eval.json pipeline-export/ }
          foreach ($f in @('SUMMARY.md','rules.json','OPS-CONSENSUS.md')) {
            if (Test-Path "docs/experience/$f") {
              Copy-Item "docs/experience/$f" "pipeline-export/experience/$f"
            }
          }

      - name: 连接长期数据账本
        if: success()
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: .pipeline-state
          fetch-depth: 0

      - name: 持久化评测批次（明确标记为未独立验证）
        if: success()
        shell: pwsh
        run: |
          python tools/pipeline/persist_batch.py --kind evaluation --input-dir pipeline-export --state-dir .pipeline-state
