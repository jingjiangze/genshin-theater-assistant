name: video-ingest
# 基于成熟轮子 yt-dlp 的跨平台**文本语料**采集（B站/YouTube 元数据+字幕+章节+评论）。
# 不下载视频本体：画面帧由 hd.mjs 产出（浏览器内 canvas、铺满全片）。
# 审计见 docs/VIDEO-TOOLING-AUDIT.md。
#
# 手动：Actions → video-ingest → Run workflow
#   platform=bilibili|youtube、query、limit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/video-ingest.yml
      - tools/video-frames/ingest.py
      - tools/video-frames/search.mjs
  workflow_dispatch:
    inputs:
      platform:
        description: 'bilibili 或 youtube'
        required: false
        default: 'bilibili'
      query:
        description: '搜索关键词'
        required: false
        default: '幻想真境剧诗 月谕 攻略'
      urls:
        description: '直连 URL（逗号分隔；填了跳过搜索）'
        required: false
        default: ''
      limit:
        description: '最多几个视频'
        required: false
        default: '12'
  schedule:
    - cron: '0 6 * * *'   # 每天 06:00 UTC，只做文本语料（不下载视频）

permissions:
  contents: write

concurrency:
  group: video-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 账本必须在「搜索」之前就位：搜索要读取历史 no_text_videos.txt 排除表
      - name: Checkout durable batch ledger
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: .pipeline-state
          fetch-depth: 0

      - name: 装成熟轮子（不自己造）
        run: |
          python -m pip install --upgrade pip
          # 只取文本元数据/字幕/章节/评论，不下载视频本体（用户明确不需要）
          python -m pip install yt-dlp
          yt-dlp --version

      - name: B站搜索（Playwright DOM，避开 412 风控）
        if: ${{ (github.event.inputs.platform || 'bilibili') == 'bilibili' }}
        shell: bash
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          set -euo pipefail
          QUERY="${{ github.event.inputs.query || '幻想真境剧诗 月谕 攻略' }}"
          # 单一关键词按播放量排序会被同一 UP 主占满（实测 8/8 全是 mid=431073645）。
          # 多关键词轮转采样，让证据治理能拿到真正独立的作者。
          # 优先找「文字攻略型」UP 主：纯视频讲解只有章节标题，产不出文本证据
          MORE="幻想真境剧诗 逐幕 配队 角色推荐|剧诗 文字攻略 阵容 满花|幻想真境剧诗 7.1 角色需求|剧诗 幕次 队伍 攻略"
          # 并行分支曾把 push 触发压到 2 个视频做烟测；现放开到 8（手动/定时仍用 12）
          LIMIT="${{ github.event_name == 'push' && '8' || github.event.inputs.limit || '12' }}"
          cd tools/video-frames
          npm init -y >/dev/null 2>&1 || true
          npm i playwright-core@1.64.1 --no-audit --no-fund >/dev/null
          node node_modules/playwright-core/cli.js install chromium
          # 从账本累积「无文本证据」的 BV，避免下轮重复采纯视频讲解
          EXCLUDE="$GITHUB_WORKSPACE/no_text_videos.txt"
          if [ -d "$GITHUB_WORKSPACE/.pipeline-state/.pipeline-state/batches/ingest" ]; then
            find "$GITHUB_WORKSPACE/.pipeline-state/.pipeline-state/batches/ingest" \
              -name no_text_videos.txt -type f -exec cat {} + 2>/dev/null \
              | sort -u > "$EXCLUDE" || true
          fi
          if [ ! -s "$EXCLUDE" ]; then EXCLUDE=""; fi
          node search.mjs "$QUERY" "$LIMIT" 3 "$MORE" "$EXCLUDE" 2>search-progress.log > bili-search.json
          cat search-progress.log
          python - <<'PY'
          import json, os
          d = json.load(open('bili-search.json', encoding='utf-8'))
          bvs = [x['bv'] for x in d.get('items', [])]
          assert bvs, "搜索没结果"
          # 写到仓库根（下一个 step 从根读），用绝对路径避免 cd 影响
          root = os.environ['GITHUB_WORKSPACE']
          with open(os.path.join(root, 'bili-bvs.txt'), 'w', encoding='utf-8') as f:
              f.write(','.join(bvs))
          print(f"search.mjs 产出 {len(bvs)} 个 BV")
          PY

      - name: 采集（字幕/章节/评论/弹幕 → 操作候选）
        shell: bash
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          set -euo pipefail
          PLATFORM="${{ github.event.inputs.platform || 'bilibili' }}"
          QUERY="${{ github.event.inputs.query || '幻想真境剧诗 月谕 攻略' }}"
          URLS="${{ github.event.inputs.urls || '' }}"
          LIMIT="${{ github.event_name == 'push' && '8' || github.event.inputs.limit || '12' }}"
          ARGS=(--platform "$PLATFORM" --query "$QUERY" --limit "$LIMIT" --out frames/ingest)
          if [ "$PLATFORM" = "bilibili" ] && [ -f bili-bvs.txt ]; then
            ARGS+=(--bvs "$(cat bili-bvs.txt)")
          fi
          if [ -n "$URLS" ]; then ARGS+=(--urls "$URLS"); fi
          python tools/video-frames/ingest.py "${ARGS[@]}"
          echo "### 采集结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f frames/ingest/ingest-summary.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('frames/ingest/ingest-summary.json', encoding='utf-8'))
          print(f"平台 {d['platform']} / 视频 {len(d['videos'])} 个")
          print("| 视频 | 文本行 | 操作候选 | 场景帧 | 字幕语言 |")
          print("|---|---|---|---|---|")
          for v in d['videos']:
              print(f"| {v['id']} | {v.get('text_lines',0)} | {v.get('ops_candidates',0)} | {v.get('scene_frames',0)} | {','.join(v.get('subtitle_langs',[])[:4])} |")
          PY
          fi

      - name: 与既有 C# 共识链对齐（验证 ops.json 能被读）
        shell: bash
        run: |
          python - <<'PY'
          import glob, json, os
          files = glob.glob('frames/ingest/*-ops.json')
          n = 0
          for f in files:
              d = json.load(open(f, encoding='utf-8'))
              assert isinstance(d.get('ops'), list), f
              for o in d['ops']:
                  assert {'kind','text','source'} <= set(o), (f, o)
              n += len(d['ops'])
          print(f"ops.json 结构校验通过：{len(files)} 个文件 / {n} 条候选")
          assert files, "没有产出任何 ops.json"
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-ingest-${{ github.run_id }}
          path: |
            frames/ingest/*-ops.json
            frames/ingest/ingest-summary.json
            frames/ingest/*/meta.json
            frames/ingest/*/subs.txt
            frames/ingest/no_text_videos.txt
          retention-days: 30

      - name: 写入长期数据账本
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python tools/pipeline/persist_batch.py \
            --kind ingest \
            --input-dir frames/ingest \
            --state-dir .pipeline-state
