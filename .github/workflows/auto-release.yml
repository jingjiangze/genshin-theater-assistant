name: auto-release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/auto-release.yml
      - tools/pipeline/release_knowledge.py
      - tools/pipeline/verify_candidates.py
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
  workflow_run:
    workflows: ["knowledge-extract"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: knowledge-ledger-writes
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout immutable knowledge ledger
        uses: actions/checkout@v4
        with:
          ref: automation-data
          path: .pipeline-state
          fetch-depth: 0

      - name: Verify release gates and atomically promote or roll back
        shell: bash
        run: |
          set -euo pipefail
          python tools/pipeline/release_knowledge.py \
            --ledger-repo .pipeline-state \
            --registry .pipeline-state/.pipeline-state/knowledge/registry.json \
            --releases-dir .pipeline-state/.pipeline-state/knowledge/releases \
            --active-pointer .pipeline-state/.pipeline-state/knowledge/active.json \
            --health-report .pipeline-state/.pipeline-state/knowledge/post-release-health.json \
            | tee release-decision.json
          echo "### 自动知识发布" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('release-decision.json',encoding='utf-8'))
          print(f"action={d.get('action')} reason={d.get('reason','')} release={d.get('release_id','')} candidates={d.get('candidate_count','')}")
          PY
